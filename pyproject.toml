[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "gnsstools4astro"
version = "0.1.0"
description = "Ferramentas para dados GNSS/RINEX aplicados à astronomia (download de RINEX, tracks por TLE, estimativa de sinal)."
readme = "README.md"
requires-python = ">=3.11,<=3.14"
authors = [
  { name = "Luciano Barosi", email = "lbarosi@df.ufcg.edu.br" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.3",
  "pandas>=2.2",
  "xarray>=2022.3.1",
  "skyfield>=1.53,<2.0",
  "sgp4>=2.24",
  "pydantic>=2",
  "httpx>=0.28",
  "georinex>=1.16.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.scripts]
gnss4astro = "gnsstools4astro.bootstrap.gnss4astro_cli:main"

[project.urls]
Homepage = "https://github.com/barosil/RadioSkySim"
"Bug Tracker" = "https://github.com/barosil/RadioSkySim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gnsstools4astro"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]
testpaths = ["tests"]
